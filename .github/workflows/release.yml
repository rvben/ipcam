name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    # Guard: self-hosted runners only execute on trusted events (tag push).
    # Fork PRs must never dispatch jobs to self-hosted.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ipcam-linux-x86_64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: ipcam-linux-aarch64
            use_cross: true

          - target: x86_64-apple-darwin
            os: [self-hosted, macOS, ARM64]
            artifact: ipcam-macos-x86_64

          - target: aarch64-apple-darwin
            os: [self-hosted, macOS, ARM64]
            artifact: ipcam-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cp target/${{ matrix.target }}/release/ipcam ${{ matrix.artifact }}
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256 || shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --locked || echo "Publish failed (may already exist)"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: Create GitHub Release
    needs: [build, publish-crate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*

  update-homebrew:
    name: Update Homebrew Tap
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p binaries
          for artifact in ipcam-macos-aarch64 ipcam-macos-x86_64 ipcam-linux-x86_64; do
            gh release download "$GITHUB_REF_NAME" \
              --repo rvben/ipcam \
              --pattern "$artifact" \
              --dir binaries
          done

      - name: Compute checksums
        id: checksums
        run: |
          echo "macos_aarch64=$(sha256sum binaries/ipcam-macos-aarch64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "macos_x86_64=$(sha256sum binaries/ipcam-macos-x86_64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux_x86_64=$(sha256sum binaries/ipcam-linux-x86_64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          # Authenticate to the tap with a write deploy key scoped to
          # rvben/homebrew-tap. The key does not expire, so cross-repo pushes
          # keep working without periodic token rotation.
          mkdir -p ~/.ssh
          echo "$HOMEBREW_TAP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone git@github.com:rvben/homebrew-tap.git
          cd homebrew-tap

          VERSION="${{ steps.version.outputs.version }}"
          SHA_MACOS_ARM="${{ steps.checksums.outputs.macos_aarch64 }}"
          SHA_MACOS_X86="${{ steps.checksums.outputs.macos_x86_64 }}"
          SHA_LINUX_X86="${{ steps.checksums.outputs.linux_x86_64 }}"

          # Update version
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/ipcam.rb

          # Update checksums by matching the url line preceding each sha256
          python3 -c "
          import re, sys
          with open('Formula/ipcam.rb') as f:
              content = f.read()
          shas = {
              'macos-aarch64': '${SHA_MACOS_ARM}',
              'macos-x86_64': '${SHA_MACOS_X86}',
              'linux-x86_64': '${SHA_LINUX_X86}',
          }
          for artifact, sha in shas.items():
              pattern = r'(url \"[^\"]*' + re.escape(artifact) + r'[^\"]*\"\s*\n\s*sha256 \")[a-f0-9]{64}(\")'
              content = re.sub(pattern, r'\g<1>' + sha + r'\2', content)
          with open('Formula/ipcam.rb', 'w') as f:
              f.write(content)
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ipcam.rb
          git commit -m "feat(ipcam): update to v${VERSION}"
          git push
