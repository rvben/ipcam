[package]
name = "ipcam"
version = "0.0.4"
edition = "2024"
description = "A CLI for managing IP cameras (Tapo, Reolink) via RTSP and vendor APIs"
license = "MIT"
repository = "https://github.com/rvben/ipcam"
homepage = "https://github.com/rvben/ipcam"
keywords = ["camera", "ip-camera", "rtsp", "tapo", "reolink"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "6"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
base64 = "0.22"
futures = "0.3.32"
humantime = "2"
rand = "0.9"
sha1 = "0.10"
viuer = { version = "0.11", features = ["print-file"] }

[profile.release]
lto = true
strip = true
